name: 'Setup Vellum Environment'
description: 'Prepara Node, pnpm, Rust, caché y dependencias de OS para compilar Vellum'
inputs:
  os:
    description: 'El sistema operativo del runner'
    required: true
  node:
    description: 'Instala pnpm/Node y restaura la caché de Turbo'
    required: false
    default: 'true'
  rust:
    description: 'Instala Rust y restaura la caché del workspace Cargo'
    required: false
    default: 'true'
  linux-deps:
    description: 'Instala las dependencias nativas de Tauri en Linux'
    required: false
    default: 'true'
  e2e-deps:
    description: 'Añade WebKitWebDriver y Xvfb a las dependencias Linux'
    required: false
    default: 'false'
  cache-class:
    description: >-
      Clase de trabajo que comparte caché de Cargo (compile | quality | e2e |
      audit). Jobs de clases distintas NO deben compartir target/.
    required: false
    default: 'shared'

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v6
      if: inputs.node == 'true'
      with:
        version: 10.33.0

    - uses: actions/setup-node@v7
      if: inputs.node == 'true'
      with:
        node-version: 24
        cache: pnpm

    - name: Cache Turborepo
      if: inputs.node == 'true'
      uses: actions/cache@v6
      with:
        path: .turbo
        key: turbo-${{ inputs.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ inputs.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
          turbo-${{ inputs.os }}-

    # Debe coincidir con rust-toolchain.toml. Usar `stable` instalaba además
    # una toolchain móvil antes de que rustup seleccionara la fijada por el repo.
    - uses: dtolnay/rust-toolchain@1.96.0
      if: inputs.rust == 'true'
      with:
        # Descarga los targets universales si estamos en Mac, y los componentes de linting
        targets: ${{ inputs.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2
      if: inputs.rust == 'true'
      with:
        # Cargo.toml vive en la raíz, por lo que todos los crates escriben en
        # ./target.
        workspaces: '. -> target'
        # La clave lleva el runner exacto y la clase de trabajo. rust-cache sólo
        # aísla por `runner.os`, que es `Linux` tanto en ubuntu-22.04 como en
        # ubuntu-latest (24.04), y `shared-key` sustituye al aislamiento por job:
        # con una sola clave, `cargo check` restauraba un target/ producido por
        # clippy/test en otra imagen. Cargo daba `tauri` por fresca y rustc no
        # encontraba su .rmeta -> E0463 intermitente en parser-cslmap.
        shared-key: vellum-${{ inputs.os }}-${{ inputs.cache-class }}
        # Bump manual: invalida de una vez las cachés mezcladas anteriores.
        prefix-key: v1-vellum

    - name: Install system dependencies (Linux)
      if: inputs.linux-deps == 'true' && (inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-latest')
      shell: bash
      run: |
        packages=(
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libappindicator3-dev
          librsvg2-dev
          patchelf
        )
        if [ "${{ inputs.e2e-deps }}" = "true" ]; then
          packages+=(webkit2gtk-driver xvfb)
        fi
        sudo apt-get update
        sudo apt-get install -y "${packages[@]}"
