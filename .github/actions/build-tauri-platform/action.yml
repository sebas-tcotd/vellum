name: 'Build Tauri Platform'
description: 'Compila (check) o compila+firma+publica (release) el shell Tauri para una plataforma de la matriz'

inputs:
  mode:
    description: "'check' (cargo check, sin firma) o 'release' (tauri build, firma, upload)"
    required: true
  platform:
    description: 'Valor de matrix.platform del job llamador (windows-latest | macos-latest | ubuntu-22.04)'
    required: true
  args:
    description: 'Args extra de tauri build para esta plataforma (matrix.args). Solo se usa en mode=release.'
    required: false
    default: ''
  bundle-glob:
    description: 'Glob del instalador generado (matrix.bundle-glob). Solo se usa en mode=release.'
    required: false
    default: ''
  release-id:
    description: 'ID del GitHub Release draft. Solo se usa en mode=release.'
    required: false
    default: ''
  tag-name:
    description: 'Tag del release en curso. Solo se usa en mode=release.'
    required: false
    default: ''
  github-token:
    description: 'GITHUB_TOKEN del workflow llamador. Solo se usa en mode=release.'
    required: false
    default: ''
  windows-certificate:
    description: 'Certificado Windows Authenticode en base64. Solo se usa en mode=release.'
    required: false
    default: ''
  windows-certificate-password:
    description: 'Password del certificado Windows. Solo se usa en mode=release.'
    required: false
    default: ''
  tauri-signing-private-key:
    description: 'Clave privada de firma del updater Tauri. Solo se usa en mode=release.'
    required: false
    default: ''
  tauri-signing-private-key-password:
    description: 'Password de la clave privada Tauri. Solo se usa en mode=release.'
    required: false
    default: ''
  windows-signing:
    description: "'true' cuando hay certificado Authenticode disponible; cualquier otro valor publica el MSI sin firmar y lo deja registrado. Solo se usa en mode=release."
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Download pre-built frontend
      uses: actions/download-artifact@v7
      with:
        name: frontend-dist
        path: apps/desktop/dist

    - name: Install macOS universal Rust targets
      if: inputs.platform == 'macos-latest'
      shell: bash
      run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

    # --- mode: check -----------------------------------------------------

    - name: Compile check desktop Rust shell
      if: inputs.mode == 'check'
      shell: bash
      run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

    # --- mode: release -----------------------------------------------------
    # The caller's preflight job decides the signing policy once, before this
    # action ever runs, and hands it down as `windows-signing`. Updater signing
    # (TAURI_SIGNING_PRIVATE_KEY) is still gated there and still blocks:
    # without it `latest.json` does not validate. Platform code signing does
    # not block — it warns and is recorded (Story 1.8, AC3).

    - name: Import Windows code signing certificate
      id: import-cert
      if: inputs.mode == 'release' && inputs.platform == 'windows-latest' && inputs.windows-signing == 'true'
      shell: pwsh
      env:
        WINDOWS_CERTIFICATE: ${{ inputs.windows-certificate }}
        WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.windows-certificate-password }}
      run: |
        $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
        $certPath = Join-Path $env:RUNNER_TEMP "vellum-signing.pfx"
        [IO.File]::WriteAllBytes($certPath, $certBytes)
        $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
        $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
        Remove-Item $certPath -Force
        "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

    - name: Compute build args
      id: build-args
      if: inputs.mode == 'release'
      shell: bash
      run: |
        ARGS="${{ inputs.args }}"
        # beforeBuildCommand is always disabled here: the frontend was already
        # built once in the caller's build-frontend job and downloaded above.
        # If this override ever misbehaves in practice, the safe rollback is
        # to drop the ,"build":{"beforeBuildCommand":""} fragment from both
        # branches below and let tauri-action rebuild the frontend per platform
        # again, as it did before this change.
        if [ "${{ inputs.platform }}" = "windows-latest" ] && [ "${{ inputs.windows-signing }}" = "true" ]; then
          CONFIG_JSON=$(printf '{"bundle":{"windows":{"certificateThumbprint":"%s","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}},"build":{"beforeBuildCommand":""}}' "${{ steps.import-cert.outputs.thumbprint }}")
        else
          CONFIG_JSON='{"build":{"beforeBuildCommand":""}}'
        fi
        ARGS="$ARGS --config $CONFIG_JSON"
        echo "args=$ARGS" >> "$GITHUB_OUTPUT"

    - name: Build and upload release
      id: tauri-build
      if: inputs.mode == 'release'
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.tauri-signing-private-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.tauri-signing-private-key-password }}
      with:
        releaseId: ${{ inputs.release-id }}
        # releaseId identifies the draft; tagName makes updater URLs point to
        # the immutable release tag instead of the moving `latest` alias.
        tagName: ${{ inputs.tag-name }}
        args: ${{ steps.build-args.outputs.args }}
        projectPath: apps/desktop

    - name: Verify Authenticode signature (Windows, AC3)
      if: inputs.mode == 'release' && inputs.platform == 'windows-latest' && inputs.windows-signing == 'true'
      shell: pwsh
      run: |
        # Every MSI, not the first: bundle.windows.wix.language declares en-US
        # and es-ES, so WiX emits one installer per locale and both are
        # published. Verifying only the first would let an unsigned or
        # invalidly signed sibling ship past a gate documented as blocking.
        $installers = @(Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release/bundle/msi" -Filter *.msi -Recurse)
        if ($installers.Count -eq 0) {
          Write-Error "No .msi artifact found to verify."
          exit 1
        }
        $failed = $false
        foreach ($msi in $installers) {
          $sig = Get-AuthenticodeSignature -FilePath $msi.FullName
          $subject = $sig.SignerCertificate.Subject
          Write-Host "$($msi.Name) - status: $($sig.Status) - subject: $subject"
          if ($sig.Status -ne 'Valid' -or [string]::IsNullOrWhiteSpace($subject)) {
            Write-Output "::error title=Invalid MSI signature::$($msi.Name) status $($sig.Status)"
            $failed = $true
          }
        }
        if ($failed) {
          Write-Error "At least one MSI Authenticode signature is missing or invalid."
          exit 1
        }
        # SmartScreen "unknown publisher" reputation additionally depends on install-base
        # telemetry that only a real, clean-machine install can confirm — see Task 4 evidence.

    # Not a warning in a log any more: the annotation is visible on the run,
    # and `signing-evidence.md` carries the same fact into the release itself.
    - name: Record unsigned Windows installer
      if: inputs.mode == 'release' && inputs.platform == 'windows-latest' && inputs.windows-signing != 'true'
      shell: pwsh
      run: |
        $installers = @(Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release/bundle/msi" -Filter *.msi -Recurse)
        if ($installers.Count -eq 0) {
          Write-Error "No .msi artifact found for the unsigned Windows release."
          exit 1
        }
        # One annotation per published installer: naming only the first would
        # under-report what actually ships without a signature.
        foreach ($msi in $installers) {
          $sig = Get-AuthenticodeSignature -FilePath $msi.FullName
          Write-Output "::warning title=Unsigned Windows installer::$($msi.Name) is published without an Authenticode signature (status: $($sig.Status)). See signing-evidence.md on the release."
        }

    # El DMG ya no se reabre después del build. Antes, este punto convertía el
    # DMG a lectura/escritura, copiaba dentro `Leeme-Install-ReadMe.txt` y lo
    # reempaquetaba: un archivo copiado *después* de que el bundler colocara los
    # iconos queda sin posición asignada y aparece encima del layout deliberado
    # que ahora declara `bundle.macOS.dmg` (Story 1.9). La guía de instalación
    # vive en el cuerpo del release (`publish-release.yml`) y el `xattr -cr` de
    # Gatekeeper en el README, donde se leen antes de descargar en vez de
    # después de montar.

    # Read-only on purpose. Removing the old `hdiutil convert` round trip also
    # removed the only step that ever opened the DMG in CI, so a truncated or
    # corrupt image would now pass `finalize-release` on the strength of its
    # filename alone. `attach -readonly` mounts it, looks, and detaches: it
    # cannot rewrite the image, so it cannot disturb the icon layout the way the
    # repack did.
    - name: Verify the DMG mounts and carries only what it should (macOS)
      if: inputs.mode == 'release' && inputs.platform == 'macos-latest'
      shell: bash
      run: |
        set -euo pipefail
        DMG=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
        MOUNT_DIR=$(mktemp -d)
        hdiutil attach "$DMG" -mountpoint "$MOUNT_DIR" -nobrowse -noautoopen -readonly
        trap 'hdiutil detach "$MOUNT_DIR" -quiet || true' EXIT
        ls -A1 "$MOUNT_DIR"
        test -d "$MOUNT_DIR/Vellum.app" || { echo "::error::Vellum.app is missing from the DMG"; exit 1; }
        test -e "$MOUNT_DIR/Applications" || { echo "::error::The Applications alias is missing from the DMG"; exit 1; }
        STRAY=$(ls -A1 "$MOUNT_DIR" | grep -v -e '^Vellum\.app$' -e '^Applications$' -e '^\.' || true)
        if [ -n "$STRAY" ]; then
          echo "::error::The DMG carries unexpected files, which land unpositioned over the layout: $STRAY"
          exit 1
        fi
        echo "DMG mounts, holds Vellum.app and the Applications alias, and nothing else."

    - name: Report installer size target (NFR12)
      if: inputs.mode == 'release'
      shell: bash
      run: |
        set -euo pipefail
        MAX_BYTES=$((20 * 1024 * 1024))
        FILES=$(ls ${{ inputs.bundle-glob }} 2>/dev/null || true)
        if [ -z "$FILES" ]; then
          echo "::error::No installer artifact matched ${{ inputs.bundle-glob }}"
          exit 1
        fi
        # Every match: Windows now produces one MSI per WiX locale, and a size
        # report that only ever looked at the first would miss the other.
        for FILE in $FILES; do
          SIZE=$(wc -c < "$FILE" | tr -d ' ')
          NAME=$(basename "$FILE")
          echo "Installer: $NAME — $SIZE bytes"
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            echo "::warning::$NAME is $SIZE bytes, exceeds the $MAX_BYTES byte target (NFR12). Publishing continues; optimize in a future release."
          else
            echo "NFR12 size target passed: $NAME is within $MAX_BYTES bytes."
          fi
        done

    - name: Remove uploaded asset if verification failed
      if: inputs.mode == 'release' && failure() && steps.tauri-build.outcome == 'success'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        FILE=$(ls ${{ inputs.bundle-glob }} 2>/dev/null | head -n1 || true)
        [ -z "$FILE" ] && exit 0
        NAME=$(basename "$FILE")
        ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/${{ inputs.release-id }}/assets" --jq ".[] | select(.name == \"$NAME\") | .id" || true)
        if [ -n "$ASSET_ID" ]; then
          echo "Removing failed-verification asset $NAME (asset id $ASSET_ID) from the draft release."
          gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID" || true
        fi
