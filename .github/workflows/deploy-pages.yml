name: Deploy Vellum Landing

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - '.github/workflows/deploy-pages.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build landing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate landing types
        run: pnpm --filter @vellum/landing lint

      - name: Build landing
        run: pnpm --filter @vellum/landing build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/landing/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Verify deployed landing
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check deployed HTML and assets
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail

          test -n "$PAGE_URL"

          html_file="$(mktemp)"
          trap 'rm -f "$html_file"' EXIT

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$PAGE_URL" --output "$html_file"

          grep -q '<title>Vellum' "$html_file"

          asset_paths="$(grep -oE '(src|href)="\./assets/[^"]+"' "$html_file" \
            | sed -E 's/^[^\"]+"([^\"]+)".*$/\1/' \
            | sort -u)"
          test -n "$asset_paths"

          while IFS= read -r asset_path; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "${PAGE_URL%/}/${asset_path#./}" --output /dev/null
          done <<< "$asset_paths"

          # A real static entry is required: test both directory URL forms,
          # without relying on a SPA fallback, including a repository prefix.
          for privacy_path in privacy privacy/; do
            privacy_url="${PAGE_URL%/}/${privacy_path}"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "$privacy_url" --output "$html_file"
            grep -q '<title>Privacy | Vellum City Maps</title>' "$html_file"
            grep -q 'data-page="privacy"' "$html_file"
            if grep -qiE 'googletagmanager|gtag\(' "$html_file"; then
              echo '::error::Privacy page unexpectedly loads analytics'
              exit 1
            fi
            asset_paths="$(grep -oE '(src|href)="\.\./assets/[^"]+"' "$html_file" \
              | sed -E 's/^[^\"]+"([^\"]+)".*$/\1/' | sort -u)"
            test -n "$asset_paths"
            while IFS= read -r asset_path; do
              curl --fail --silent --show-error --location \
                --retry 5 --retry-delay 5 --retry-all-errors \
                "${PAGE_URL%/}/${asset_path#../}" --output /dev/null
            done <<< "$asset_paths"
          done
