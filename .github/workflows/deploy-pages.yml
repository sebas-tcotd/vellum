name: Deploy Vellum Landing

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - '.github/workflows/deploy-pages.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
  workflow_run:
    workflows: ['Publish Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build landing
    # A failed release run leaves the previous deploy in place.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate landing types
        run: pnpm --filter @vellum/landing lint

      - name: Build landing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @vellum/landing build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/landing/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Verify deployed landing
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check deployed HTML and assets
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail

          test -n "$PAGE_URL"
          page_url="${PAGE_URL%/}/"
          origin="$(printf '%s' "$page_url" | sed -E 's#^(https?://[^/]+).*$#\1#')"
          base_path="${page_url#"$origin"}"
          test "$base_path" = '/vellum/'

          html_file="$(mktemp)"
          trap 'rm -f "$html_file"' EXIT

          fetch() {
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-all-errors "$@"
          }

          # Every src, href and island script must be an absolute path under
          # /vellum/ and answer 200.
          check_assets() {
            local asset_paths
            asset_paths="$(grep -oE '(src|href|component-url|renderer-url)="/[^"]+"' "$html_file" \
              | sed -E 's/^[^"]+"([^"]+)"$/\1/' \
              | sort -u)"
            test -n "$asset_paths"
            while IFS= read -r asset_path; do
              case "$asset_path" in
                "$base_path"*) ;;
                *)
                  echo "::error::Asset outside $base_path: $asset_path"
                  exit 1
                  ;;
              esac
              fetch "${origin}${asset_path}" --output /dev/null
            done <<< "$asset_paths"
            if grep -qE '(src|href)="\.\.?/' "$html_file"; then
              echo '::error::Served HTML still uses relative asset paths'
              exit 1
            fi
          }

          # Home: the Bridge hard link /vellum/#download lands here.
          fetch "$page_url" --output "$html_file"
          grep -q '<title>Vellum' "$html_file"
          grep -q '<html lang="en">' "$html_file"
          grep -q "<link rel=\"canonical\" href=\"${page_url}\">" "$html_file"
          grep -q 'releases/download/v' "$html_file"
          check_assets

          # Privacy is the Partner Center URL: a real static page in both
          # directory forms, without SPA fallback, analytics or redirects
          # other than the trailing-slash one.
          for privacy_path in privacy privacy/; do
            final_url="$(fetch "${page_url}${privacy_path}" \
              --output "$html_file" --write-out '%{url_effective}')"
            test "$final_url" = "${page_url}privacy/"
            grep -q '<title>Privacy | Vellum City Maps</title>' "$html_file"
            grep -q 'data-page="privacy"' "$html_file"
            grep -q '<html lang="en">' "$html_file"
            grep -q "<link rel=\"canonical\" href=\"${page_url}privacy/\">" "$html_file"
            if grep -qiE 'googletagmanager|gtag\(' "$html_file"; then
              echo '::error::Privacy page unexpectedly loads analytics'
              exit 1
            fi
            check_assets
          done

          # A missing route answers the real 404 page, never the home.
          status="$(curl --silent --show-error --retry 5 --retry-delay 5 \
            --output "$html_file" --write-out '%{http_code}' \
            "${page_url}no-existe/")"
          test "$status" = '404'
          grep -q '<title>Page not found | Vellum</title>' "$html_file"
          check_assets
