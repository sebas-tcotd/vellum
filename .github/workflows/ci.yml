name: PR & Main Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vellum Environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ubuntu-latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release configuration
        run: pnpm release:verify

      - name: Prettier Format Check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript Tests
        run: pnpm test

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Clippy Check
        run: cargo clippy --workspace -- -D warnings

      - name: Rust Tests
        run: cargo test --workspace

      # NOTE: Los tests E2E (Playwright + tauri-driver) NO se ejecutan en este CI en v1.
      # Requieren: build de Tauri completo, `cargo install tauri-driver`, y display virtual (Xvfb) en Linux.
      # Para ejecutarlos localmente: `pnpm test:e2e` (requiere tauri-driver instalado y app compilada).
      # Pipeline de release o job manual dedicado cuando se implemente en Story 2.x+.

  build-frontend:
    name: Build frontend (shared)
    # Sin needs de lint-and-test: arranca en paralelo, igual que compile-matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A diferencia del `pnpm --filter ... run build:vite` anterior, esto sí
      # pasa por turbo y se beneficia de su cache — antes se reconstruía el
      # frontend una vez por cada plataforma de compile-matrix, sin cache.
      - name: Build frontend
        run: pnpm --filter @vellum/desktop run build:vite

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
          retention-days: 1

  compile-matrix:
    name: Compile Check ${{ matrix.platform }}
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vellum Environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ${{ matrix.platform }}

      # MAGIA: Usamos `check` en lugar de `build`. Un 60% más rápido.
      - name: Compile check desktop Rust shell
        uses: ./.github/actions/build-tauri-platform
        with:
          mode: check
          platform: ${{ matrix.platform }}
