name: PR & Main Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Este workflow sólo lee el repositorio. Sin esta línea heredaba el default de
# la organización, que puede ser `write` para todo — los demás workflows del
# repo ya lo declaran; éste era el único que no.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.changes.outputs.js }}
      rust: ${{ steps.changes.outputs.rust }}
      frontend: ${{ steps.changes.outputs.frontend }}
      e2e: ${{ steps.changes.outputs.e2e }}
      compile: ${{ steps.changes.outputs.compile }}
      landing: ${{ steps.changes.outputs.landing }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
      bridge: ${{ steps.changes.outputs.bridge }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/detect-ci-changes.mjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --mode "${{ github.event_name }}"

  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ubuntu-latest
          rust: 'false'
          linux-deps: 'false'

      - run: pnpm install --frozen-lockfile

      - name: Verify release configuration
        run: pnpm release:verify

      - name: Prettier Format Check
        run: pnpm format:check

      - name: Network surface guardrail
        run: pnpm check:network

      - name: Installer identity guardrail
        run: pnpm check:installer

  js-quality:
    name: JavaScript quality
    needs: detect-changes
    if: needs.detect-changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ubuntu-latest
          rust: 'false'
          linux-deps: 'false'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  # Windows también: la rama de MSIX (`#[cfg(windows)]`) solo compila ahí, y un
  # fallo de clippy suyo llegó a pasar CI (retro 2026-10-01, M1).
  rust-quality:
    name: Rust quality (${{ matrix.os }})
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ${{ matrix.os }}
          node: 'false'
          cache-class: quality

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  # La frontera entre el escritor C# de Bridge y el lector Rust: el arnés .NET
  # escribe sus .vellummap y los dos lados que leen el formato (el lector y el
  # JSON Schema publicado) tienen que aceptarlos (retro 2026-10-01, C1).
  bridge-contract:
    name: Bridge contract
    needs: detect-changes
    if: needs.detect-changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Con las dependencias nativas de Linux: `parser-cslmap` depende de `tauri`, que
      # compila glib/GTK aunque el ejemplo no abra ninguna ventana.
      - name: Setup Vellum environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ubuntu-latest
          cache-class: bridge

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - run: pnpm install --frozen-lockfile

      - name: Write the harness documents
        run: dotnet run --project tools/vellum-bridge/tests -- "$RUNNER_TEMP/vb"

      - name: Read them with the Rust reader
        run: |
          for doc in deflate stored filtered stations; do
            cargo run -q -p parser-cslmap --example validate_vellummap -- "$RUNNER_TEMP/vb/$doc.vellummap"
          done

      - name: Validate them against the JSON Schema
        run: |
          dirs=()
          for doc in deflate stored filtered stations; do
            unzip -q "$RUNNER_TEMP/vb/$doc.vellummap" -d "$RUNNER_TEMP/vbx/$doc"
            dirs+=("$RUNNER_TEMP/vbx/$doc")
          done
          pnpm --filter @vellum/parser-cslmap exec node schema/validate-extracted.mjs "${dirs[@]}"

  dependency-audit:
    name: Dependency Audit (informative)
    needs: detect-changes
    if: needs.detect-changes.outputs.dependencies == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Vellum Environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ubuntu-latest
          linux-deps: 'false'
          cache-class: audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `cargo install cargo-deny` compila ~5 min desde cero; el binario es lo
      # único que hace falta cachear.
      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.20.2

      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.20.2 --force

      # El script escribe el reporte en $GITHUB_STEP_SUMMARY por su cuenta y
      # siempre sale con 0.
      - name: Audit JavaScript and Rust dependencies
        run: pnpm audit:deps

  build-frontend:
    name: Build frontend (shared)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ubuntu-latest
          rust: 'false'
          linux-deps: 'false'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm turbo run build:vite --filter=@vellum/desktop

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: apps/desktop/dist
          retention-days: 1

  e2e-golden-flow:
    name: E2E Golden Flow
    needs: [detect-changes, build-frontend]
    if: needs.detect-changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e-golden-flow.yml
    with:
      frontend_artifact: true

  msix-packaging:
    name: Windows MSIX packaging tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-vellum
        with:
          os: windows-latest
          rust: 'false'
          linux-deps: 'false'
      - run: pnpm install --frozen-lockfile
      - name: Exercise PowerShell and the real Windows SDK
        env:
          REQUIRE_MSIX_SDK: '1'
        run: pnpm exec vitest run --config vitest.scripts.config.mjs scripts/package-msix.test.mjs

  compile-matrix:
    name: Compile Check ${{ matrix.platform }}
    needs: detect-changes
    if: needs.detect-changes.outputs.compile == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Vellum Environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ${{ matrix.platform }}
          node: 'false'
          cache-class: compile

      - name: Compile check desktop Rust shell
        uses: ./.github/actions/build-tauri-platform
        with:
          mode: check
          platform: ${{ matrix.platform }}

  landing-quality:
    name: Landing quality
    needs: detect-changes
    if: needs.detect-changes.outputs.landing == 'true'
    uses: ./.github/workflows/landing-ci.yml

  # Conserva el nombre visible del check histórico para no romper la
  # protección de rama. Un skip sólo es válido cuando el router lo esperaba.
  lint-and-test:
    name: Code Quality & Tests
    if: always()
    needs:
      - detect-changes
      - repository-checks
      - msix-packaging
      - js-quality
      - rust-quality
      - build-frontend
      - e2e-golden-flow
      - compile-matrix
      - landing-quality
      - bridge-contract
    runs-on: ubuntu-latest
    steps:
      - name: Require Windows MSIX packaging tests
        env:
          MSIX_RESULT: ${{ needs.msix-packaging.result }}
        run: test "$MSIX_RESULT" = success

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify routed job results
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
          JS_EXPECTED: ${{ needs.detect-changes.outputs.js }}
          JS_RESULT: ${{ needs.js-quality.result }}
          RUST_EXPECTED: ${{ needs.detect-changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust-quality.result }}
          FRONTEND_EXPECTED: ${{ needs.detect-changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.build-frontend.result }}
          E2E_EXPECTED: ${{ needs.detect-changes.outputs.e2e }}
          E2E_RESULT: ${{ needs.e2e-golden-flow.result }}
          COMPILE_EXPECTED: ${{ needs.detect-changes.outputs.compile }}
          COMPILE_RESULT: ${{ needs.compile-matrix.result }}
          LANDING_EXPECTED: ${{ needs.detect-changes.outputs.landing }}
          LANDING_RESULT: ${{ needs.landing-quality.result }}
          BRIDGE_EXPECTED: ${{ needs.detect-changes.outputs.bridge }}
          BRIDGE_RESULT: ${{ needs.bridge-contract.result }}
        run: node scripts/verify-ci-gate.mjs
