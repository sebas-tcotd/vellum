name: PR & Main Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Este workflow sólo lee el repositorio. Sin esta línea heredaba el default de
# la organización, que puede ser `write` para todo — los demás workflows del
# repo ya lo declaran; éste era el único que no.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Vellum Environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ubuntu-latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release configuration
        run: pnpm release:verify

      - name: Prettier Format Check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript Tests
        run: pnpm test

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Clippy Check
        run: cargo clippy --workspace -- -D warnings

      - name: Rust Tests
        run: cargo test --workspace

      # Congela la superficie de red (Story 1.8 AC4). Este sí bloquea: no
      # depende de ninguna base externa, sólo del árbol que trae el PR.
      - name: Network surface guardrail
        run: pnpm check:network

      # Congela la identidad de instalador (Story 1.9): metadatos contra
      # `brand/`, artwork derivado con sus dimensiones exactas, la asociación
      # `.cslmap` opt-in de la 7.5 y la ausencia de scripts de instalación.
      # Bloqueante por la misma razón que el de red: sólo mira este árbol.
      - name: Installer identity guardrail
        run: pnpm check:installer

  # Auditoría de dependencias — informativa por decisión (Story 1.8 AC2).
  #
  # `continue-on-error` a nivel de job, además del `exit 0` del script: la base
  # de advisories cambia sin que nadie toque el repo, así que un rojo acá
  # significaría "hoy se publicó un advisory", no "este PR rompió algo". Lo que
  # sí se garantiza es visibilidad — el reporte va al summary del run, y el
  # pipeline de release lo adjunta a `signing-evidence.md`.
  #
  # Sin `needs`: es hermano top-level de lint-and-test, no su continuación.
  dependency-audit:
    name: Dependency Audit (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Vellum Environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ubuntu-latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `cargo install cargo-deny` compila ~5 min desde cero; el binario es lo
      # único que hace falta cachear.
      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.18.4

      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.18.4

      # El script escribe el reporte en $GITHUB_STEP_SUMMARY por su cuenta y
      # siempre sale con 0.
      - name: Audit JavaScript and Rust dependencies
        run: pnpm audit:deps

  # El recorrido cartográfico real. En `publish-release` el bloqueo es real y
  # está en el repo: `build-release` lo tiene en `needs`. Aquí el check sale en
  # rojo, pero que además impida el merge depende de marcarlo como required en
  # la protección de rama, que no vive en estos archivos.
  e2e-golden-flow:
    name: E2E Golden Flow
    uses: ./.github/workflows/e2e-golden-flow.yml

  build-frontend:
    name: Build frontend (shared)
    # Sin needs de lint-and-test: arranca en paralelo, igual que compile-matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A diferencia del `pnpm --filter ... run build:vite` anterior, esto sí
      # pasa por turbo y se beneficia de su cache — antes se reconstruía el
      # frontend una vez por cada plataforma de compile-matrix, sin cache.
      - name: Build frontend
        run: pnpm --filter @vellum/desktop run build:vite

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: apps/desktop/dist
          retention-days: 1

  compile-matrix:
    name: Compile Check ${{ matrix.platform }}
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Vellum Environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ${{ matrix.platform }}

      # MAGIA: Usamos `check` en lugar de `build`. Un 60% más rápido.
      - name: Compile check desktop Rust shell
        uses: ./.github/actions/build-tauri-platform
        with:
          mode: check
          platform: ${{ matrix.platform }}
