name: Publish Release

# Required GitHub Actions secrets (Stories 7.5 and release automation):
#   RELEASE_PLEASE_TOKEN
#     - PAT or GitHub App token used by Release Please. It must be allowed to
#       create pull requests, tags and releases, and is required because a
#       default GITHUB_TOKEN does not reliably trigger the tag workflow.
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     - Sign updater artifacts for tauri-plugin-updater. Not a code-signing
#       certificate; unrelated to Authenticode/SmartScreen (see 7.5 Dev Notes).
#   WINDOWS_CERTIFICATE (base64-encoded .pfx), WINDOWS_CERTIFICATE_PASSWORD
#     - Authenticode code-signing certificate for the Windows MSI (AC3). The
#       windows build job fails before producing an unsigned MSI if these are
#       missing, unless the repository variable ALLOW_UNSIGNED_WINDOWS is
#       explicitly set to 'true' as a temporary opt-in.
#   ALLOW_UNSIGNED_WINDOWS (repository variable, not a secret)
#     - Set to 'true' only for a temporary unsigned Windows release. This
#       bypasses Authenticode import/verification but never bypasses Tauri
#       updater signing via TAURI_SIGNING_PRIVATE_KEY.
#
# Release publication policy:
#   Release Please creates the GitHub Release as a draft and force-creates its
#   tag. This workflow resolves that existing draft, builds and uploads all
#   platform artifacts, then publishes it (draft -> false) ONLY after every
#   platform's signature check, size check (NFR12), updater manifest check and
#   release-wide asset check pass.
#   A failed verification leaves the release as a draft — nothing is
#   auto-published from a broken build.

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  resolve-release:
    name: Resolve Release Please draft
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.resolve-release.outputs.release-id }}
    steps:
      - name: Resolve existing Release by tag
        id: resolve-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Draft releases are not reliably returned by the release-by-tag
          # endpoint. List releases instead so the Release Please draft is
          # resolvable before it is published.
          RELEASE_ID=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | .id' | head -n1)
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::No GitHub Release exists for ${GITHUB_REF_NAME}. Release Please must create the draft before this workflow runs."
            exit 1
          fi
          echo "release-id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build ${{ matrix.platform }}
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
            bundle-glob: 'target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi'
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            bundle-glob: 'target/universal-apple-darwin/release/bundle/dmg/*.dmg'
          - platform: ubuntu-22.04
            args: ''
            bundle-glob: 'target/release/bundle/appimage/*.AppImage'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vellum Environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install macOS universal Rust targets
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Verify Tauri updater signing secrets are present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for signed updater artifacts. TAURI_SIGNING_PRIVATE_KEY_PASSWORD may be empty only when the key has no passphrase."
            exit 1
          fi

      - name: Verify Windows signing secrets are present
        if: matrix.platform == 'windows-latest' && vars.ALLOW_UNSIGNED_WINDOWS != 'true'
        shell: bash
        run: |
          if [ -z "${{ secrets.WINDOWS_CERTIFICATE }}" ] || [ -z "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" ]; then
            echo "::error::WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD secrets are not set. Refusing to build an unsigned MSI (AC3)."
            exit 1
          fi

      - name: Import Windows code signing certificate
        id: import-cert
        if: matrix.platform == 'windows-latest' && vars.ALLOW_UNSIGNED_WINDOWS != 'true'
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
          $certPath = Join-Path $env:RUNNER_TEMP "vellum-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $securePassword = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          Remove-Item $certPath -Force
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Compute build args
        id: build-args
        shell: bash
        run: |
          ARGS="${{ matrix.args }}"
          if [ "${{ matrix.platform }}" = "windows-latest" ] && [ "${{ vars.ALLOW_UNSIGNED_WINDOWS }}" != "true" ]; then
            CONFIG_JSON=$(printf '{"bundle":{"windows":{"certificateThumbprint":"%s","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}' "${{ steps.import-cert.outputs.thumbprint }}")
            ARGS="$ARGS --config $CONFIG_JSON"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Build and upload release
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.resolve-release.outputs.release-id }}
          args: ${{ steps.build-args.outputs.args }}
          projectPath: apps/desktop

      - name: Verify Authenticode signature (Windows, AC3)
        if: matrix.platform == 'windows-latest' && vars.ALLOW_UNSIGNED_WINDOWS != 'true'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release/bundle/msi" -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) {
            Write-Error "No .msi artifact found to verify."
            exit 1
          }
          $sig = Get-AuthenticodeSignature -FilePath $msi.FullName
          $subject = $sig.SignerCertificate.Subject
          Write-Host "Signature status: $($sig.Status) - Subject: $subject"
          if ($sig.Status -ne 'Valid' -or [string]::IsNullOrWhiteSpace($subject)) {
            Write-Error "MSI Authenticode signature is missing or invalid (status: $($sig.Status))."
            exit 1
          }
          # SmartScreen "unknown publisher" reputation additionally depends on install-base
          # telemetry that only a real, clean-machine install can confirm — see Task 4 evidence.

      - name: Record intentional unsigned Windows MSI
        if: matrix.platform == 'windows-latest' && vars.ALLOW_UNSIGNED_WINDOWS == 'true'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release/bundle/msi" -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) {
            Write-Error "No .msi artifact found for the intentional unsigned Windows release."
            exit 1
          }
          $sig = Get-AuthenticodeSignature -FilePath $msi.FullName
          Write-Warning "Publishing an intentionally unsigned Windows MSI: $($msi.Name) (status: $($sig.Status))."

      - name: Add visible install guide inside the DMG (AC4, macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
          WORK=$(mktemp -d)
          MOUNT_DIR=$(mktemp -d)
          hdiutil convert "$DMG" -format UDRW -o "$WORK/rw"
          hdiutil attach "$WORK/rw.dmg" -mountpoint "$MOUNT_DIR" -nobrowse -noautoopen
          cp "apps/desktop/src-tauri/macos/Leeme-Install-ReadMe.txt" "$MOUNT_DIR/Leeme - Install ReadMe.txt"
          hdiutil detach "$MOUNT_DIR"
          hdiutil convert "$WORK/rw.dmg" -format UDZO -o "$WORK/final"
          mv "$WORK/final.dmg" "$DMG"
          rm -rf "$WORK" "$MOUNT_DIR"

      - name: Re-upload updated DMG to the release (AC4)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber -R "${{ github.repository }}"

      - name: Enforce installer size limit (NFR12)
        shell: bash
        run: |
          set -euo pipefail
          MAX_BYTES=$((20 * 1024 * 1024))
          FILE=$(ls ${{ matrix.bundle-glob }} 2>/dev/null | head -n1 || true)
          if [ -z "$FILE" ]; then
            echo "::error::No installer artifact matched ${{ matrix.bundle-glob }}"
            exit 1
          fi
          SIZE=$(wc -c < "$FILE" | tr -d ' ')
          NAME=$(basename "$FILE")
          echo "Installer: $NAME — $SIZE bytes"
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            echo "::error::$NAME is $SIZE bytes, exceeds the $MAX_BYTES byte limit (NFR12)."
            exit 1
          fi

      - name: Remove uploaded asset if verification failed
        if: failure() && steps.tauri-build.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE=$(ls ${{ matrix.bundle-glob }} 2>/dev/null | head -n1 || true)
          [ -z "$FILE" ] && exit 0
          NAME=$(basename "$FILE")
          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/${{ needs.resolve-release.outputs.release-id }}/assets" --jq ".[] | select(.name == \"$NAME\") | .id" || true)
          if [ -n "$ASSET_ID" ]; then
            echo "Removing failed-verification asset $NAME (asset id $ASSET_ID) from the draft release."
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID" || true
          fi

  finalize-release:
    name: Verify release assets and publish
    needs: [resolve-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required release assets are present
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS=$(gh api "repos/${{ github.repository }}/releases/${{ needs.resolve-release.outputs.release-id }}/assets" --jq '.[].name')
          echo "Release assets:"
          echo "$ASSETS"
          for ext in msi dmg AppImage; do
            if ! echo "$ASSETS" | grep -qi "\\.${ext}$"; then
              echo "::error::Missing required .$ext asset on the release — refusing to publish."
              exit 1
            fi
          done

          if ! echo "$ASSETS" | grep -qx 'latest.json'; then
            echo "::error::Missing latest.json updater manifest — refusing to publish."
            exit 1
          fi

      - name: Annotate temporary unsigned Windows release
        if: vars.ALLOW_UNSIGNED_WINDOWS == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_API="repos/${{ github.repository }}/releases/${{ needs.resolve-release.outputs.release-id }}"
          BODY=$(gh api "$RELEASE_API" --jq '.body')
          BODY=$(printf '%s\n\n%s' "$BODY" '> **Windows notice:** The MSI in this release is intentionally unsigned with Authenticode. Windows may show an unknown-publisher warning. Tauri updater artifacts remain cryptographically signed.')
          gh api -X PATCH "$RELEASE_API" -f body="$BODY" >/dev/null

      - name: Checkout release commit for local verification
        uses: actions/checkout@v4

      - name: Verify synchronized version files
        run: node scripts/verify-release-config.mjs

      - name: Publish release (required for the updater's latest.json endpoint)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.resolve-release.outputs.release-id }}" -f draft=false

      - name: Smoke-check public updater manifest
        id: updater-smoke-check
        env:
          MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$MANIFEST_URL" -o /tmp/latest.json
          node -e 'const m = require("/tmp/latest.json"); const platforms = Object.values(m.platforms ?? {}); if (!m.version || platforms.length === 0 || platforms.some((p) => typeof p.url !== "string" || typeof p.signature !== "string" || p.signature.length === 0)) process.exit(1);'

      - name: Revert release to draft if updater smoke check fails
        if: failure() && steps.updater-smoke-check.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.resolve-release.outputs.release-id }}" -f draft=true
