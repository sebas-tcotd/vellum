name: Publish Release

# Required GitHub Actions secrets (Stories 7.5 and release automation):
#   RELEASE_PLEASE_TOKEN
#     - PAT or GitHub App token used by Release Please. It must be allowed to
#       create pull requests, tags and releases, and is required because a
#       default GITHUB_TOKEN does not reliably trigger the tag workflow.
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     - Sign updater artifacts for tauri-plugin-updater. Not a code-signing
#       certificate; unrelated to Authenticode/SmartScreen (see 7.5 Dev Notes).
#   WINDOWS_CERTIFICATE (base64-encoded .pfx), WINDOWS_CERTIFICATE_PASSWORD
#     - Optional Authenticode code-signing certificate for the Windows
#       installers. When present the MSI is signed and the signature is
#       verified; a failed verification still fails the release. When absent
#       the release is published unsigned — see the signing policy below.
#   APPLE_SIGNING_IDENTITY
#     - Read only to warn that it is currently ignored. Nothing in this
#       repository signs or notarizes the macOS bundle, so the evidence report
#       records macOS as unsigned regardless of this secret. Wiring it in is a
#       separate change that must flip the policy step together with the steps
#       that sign (see docs/en/security-and-privacy.md).
#
# Signing policy (Story 1.8, AC3): publishing without a platform code-signing
#   certificate is legitimate and does NOT block. What is mandatory is
#   evidence: every release carries a `signing-evidence.md` asset stating, per
#   platform, whether the installer is code-signed, whether its updater
#   artifact is signed, and the dependency-audit summary for that commit — and
#   the release notes carry a high-visibility warning per unsigned platform.
#   `ALLOW_UNSIGNED_WINDOWS` is gone: nothing has to be opted into any more.
#
# Release publication policy:
#   Release Please creates the GitHub Release as a draft and force-creates its
#   tag. This workflow resolves that existing draft, builds and uploads all
#   platform artifacts, then publishes it (draft -> false) ONLY after every
#   platform's signature check, updater manifest check and release-wide asset
#   check pass. NFR12 is reported as a non-blocking size target.
#   A failed verification leaves the release as a draft — nothing is
#   auto-published from a broken build.

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve release draft and verify signing secrets
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.resolve-release.outputs.release-id }}
      windows-signing: ${{ steps.signing-policy.outputs.windows-signing }}
      macos-signing: ${{ steps.signing-policy.outputs.macos-signing }}
    steps:
      - name: Resolve existing Release by tag
        id: resolve-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Draft releases are not reliably returned by the release-by-tag
          # endpoint. List releases instead so the Release Please draft is
          # resolvable before it is published. The list-releases endpoint can
          # also lag briefly right after the tag push, so retry for up to 60s.
          RELEASE_ID=""
          for attempt in $(seq 1 12); do
            RELEASE_ID=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | .id' | head -n1)
            if [ -n "$RELEASE_ID" ]; then
              echo "Resolved release id $RELEASE_ID on attempt $attempt."
              break
            fi
            echo "::warning::No GitHub Release found for ${GITHUB_REF_NAME} yet (attempt $attempt/12)."
            sleep 5
          done
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::No GitHub Release exists for ${GITHUB_REF_NAME} after 60 seconds. Release Please must create the draft before this workflow runs."
            exit 1
          fi
          echo "release-id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      # Movido acá desde build-release: antes se repetía este chequeo 3 veces
      # (una por plataforma), cada vez después de instalar todo el toolchain.
      # Acá corre una sola vez, en segundos, antes de gastar cómputo de matriz.
      - name: Verify Tauri updater signing secrets are present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for signed updater artifacts. TAURI_SIGNING_PRIVATE_KEY_PASSWORD may be empty only when the key has no passphrase."
            exit 1
          fi

      # Warn and record, never block (AC3). This step is the single source of
      # truth for the whole run: the same two outputs drive the build's signing
      # steps, the release-notes warnings and `signing-evidence.md`, so the
      # three can never disagree.
      - name: Resolve platform code-signing policy
        id: signing-policy
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          # A half-configured certificate is the dangerous case: the build would
          # skip signing and the evidence would record "no certificate", which
          # is not what happened. Refuse to guess.
          if { [ -n "$WINDOWS_CERTIFICATE" ] && [ -z "$WINDOWS_CERTIFICATE_PASSWORD" ]; } \
            || { [ -z "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; }; then
            echo "::error title=Partial Authenticode configuration::Exactly one of WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD is set. Set both to sign, or neither to publish unsigned — a half-configured certificate would be silently ignored and misrecorded as absent."
            exit 1
          fi

          if [ -n "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            WINDOWS_SIGNING=true
            echo "Windows: Authenticode certificate present — the MSI will be signed and verified."
          else
            WINDOWS_SIGNING=false
            echo "::warning title=Unsigned Windows installer::WINDOWS_CERTIFICATE is not configured. The MSI and EXE will be published without an Authenticode signature; Windows will show an 'Unknown publisher' SmartScreen warning. Recorded in signing-evidence.md."
          fi

          # Deliberately hardcoded false, not derived from the secret. Nothing in
          # this repository signs the macOS bundle: `tauri.conf.json` declares no
          # `signingIdentity`, there is no notarization step, and the DMG is
          # remounted and repackaged after the build, which would invalidate a
          # signature anyway. Reading APPLE_SIGNING_IDENTITY here would let the
          # mere presence of a secret print "signed with an Apple Developer ID"
          # on a release that is not signed — evidence that lies is worse than no
          # evidence. Flip this only together with the steps that actually sign.
          MACOS_SIGNING=false
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning title=Apple signing identity ignored::APPLE_SIGNING_IDENTITY is set, but this pipeline does not sign or notarize macOS artifacts yet. The DMG is published unsigned and recorded as such."
          else
            echo "::warning title=Unsigned macOS app::No Apple signing identity is configured. The DMG is published unsigned and un-notarized; Gatekeeper will refuse the first launch until the user allows it in System Settings. Recorded in signing-evidence.md."
          fi

          echo "windows-signing=$WINDOWS_SIGNING" >> "$GITHUB_OUTPUT"
          echo "macos-signing=$MACOS_SIGNING" >> "$GITHUB_OUTPUT"

  # El gate real de publicación (Story 1.7). Es el mismo workflow que corre en
  # cada PR, invocado aquí de nuevo contra el commit taggeado: un tag puede
  # apuntar a algo que nunca pasó por `ci.yml`, así que la evidencia se produce
  # sobre lo que efectivamente se va a publicar, no sobre lo que se prometió.
  e2e-golden-flow:
    name: E2E Golden Flow
    needs: [preflight, build-frontend]
    uses: ./.github/workflows/e2e-golden-flow.yml
    with:
      frontend_artifact: true

  build-frontend:
    name: Build frontend (shared)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ubuntu-latest
          rust: 'false'
          linux-deps: 'false'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Antes, tauri-action reconstruía el frontend una vez por plataforma
      # (3x) vía beforeBuildCommand. Se construye acá una sola vez y se
      # descarga en cada job de build-release (ver build-tauri-platform).
      - name: Build frontend
        run: pnpm turbo run build:vite --filter=@vellum/desktop

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: apps/desktop/dist
          retention-days: 1

  # Informativo, igual que en ci.yml, pero acá el reporte además viaja al
  # release: `signing-evidence.md` lo incrusta, así que la evidencia adjunta
  # dice qué advisories estaban abiertos el día que se publicó ese binario.
  dependency-audit:
    name: Dependency audit (informative)
    needs: preflight
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Vellum Environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ubuntu-latest
          linux-deps: 'false'
          cache-class: audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.18.4

      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.18.4

      - name: Audit JavaScript and Rust dependencies
        run: pnpm audit:deps --out dependency-audit.md

      # `if: always()`: el job es continue-on-error, así que un paso anterior
      # que falle no debe hacer que la evidencia diga "no hubo auditoría"
      # cuando en realidad hay un reporte parcial escrito.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: dependency-audit.md
          retention-days: 30

  build-release:
    name: Build ${{ matrix.platform }}
    # Compilar y publicar son etapas distintas: los builds pueden solaparse con
    # el E2E porque escriben en un Release draft. finalize-release sigue siendo
    # la única puerta a público y espera ambas ramas.
    needs: [preflight, build-frontend]
    strategy:
      fail-fast: false
      # Cada celda sube assets con nombres independientes. latest.json está
      # desactivado en tauri-action y se escribe una sola vez en el job posterior.
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
            bundle-glob: 'target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi'
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            bundle-glob: 'target/universal-apple-darwin/release/bundle/dmg/*.dmg'
          - platform: ubuntu-22.04
            args: ''
            bundle-glob: 'target/release/bundle/appimage/*.AppImage'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Vellum Environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ${{ matrix.platform }}
          # Misma clase que compile-matrix a propósito: corre en las imágenes
          # idénticas y es la única caché que main escribe para estas
          # plataformas. Una clase propia sólo se guardaría bajo refs/tags/*,
          # que ningún run posterior puede leer, y arrancaría siempre fría.
          # No reintroduce la mezcla del E0463: el perfil dev vive en
          # target/debug y el release en target/release.
          cache-class: compile

      - name: Build, sign and upload release artifact
        uses: ./.github/actions/build-tauri-platform
        with:
          mode: release
          platform: ${{ matrix.platform }}
          args: ${{ matrix.args }}
          bundle-glob: ${{ matrix.bundle-glob }}
          release-id: ${{ needs.preflight.outputs.release-id }}
          tag-name: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          windows-certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          windows-certificate-password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          tauri-signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri-signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          windows-signing: ${{ needs.preflight.outputs.windows-signing }}

  generate-updater-manifest:
    name: Generate and upload updater manifest
    needs: [preflight, build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate complete updater manifest from release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.preflight.outputs.release-id }}
        run: |
          set -euo pipefail
          RELEASE_API="repos/${{ github.repository }}/releases/${RELEASE_ID}"
          ASSETS_API="${RELEASE_API}/assets?per_page=100"

          gh api "$RELEASE_API" > release.json
          RELEASE_TAG=$(jq -r '.tag_name' release.json)
          if [ "$RELEASE_TAG" != "${{ github.ref_name }}" ]; then
            echo "::error::Release ${RELEASE_ID} belongs to tag ${RELEASE_TAG}, expected ${{ github.ref_name }}."
            exit 1
          fi
          jq -r '.created_at' release.json > release-created-at.txt
          jq -r '.body // ""' release.json > release-notes.txt

          generated=false
          for attempt in $(seq 1 6); do
            # GitHub can expose the matrix uploads with a short delay. Fetch all
            # pages and regenerate from a clean signature directory each time.
            gh api --paginate --slurp "$ASSETS_API" | jq 'add' > release-assets.json
            rm -rf updater-signatures
            mkdir updater-signatures
            download_failed=false

            while IFS=$'\t' read -r asset_id asset_name; do
              if [ "$(basename "$asset_name")" != "$asset_name" ]; then
                echo "::error::Invalid release asset name: $asset_name"
                exit 1
              fi
              if ! gh api \
                -H "Accept: application/octet-stream" \
                "repos/${{ github.repository }}/releases/assets/${asset_id}" \
                > "updater-signatures/${asset_name}"; then
                download_failed=true
                break
              fi
            done < <(jq -r '.[] | select(.name | endswith(".sig")) | [.id, .name] | @tsv' release-assets.json)

            if [ "$download_failed" = false ] && node scripts/generate-updater-manifest.mjs \
              --inventory release-assets.json \
              --signatures-dir updater-signatures \
              --repository "${{ github.repository }}" \
              --tag "${{ github.ref_name }}" \
              --version "${GITHUB_REF_NAME#v}" \
              --pub-date "$(cat release-created-at.txt)" \
              --notes-file release-notes.txt \
              --output latest.json; then
              generated=true
              break
            fi

            if [ "$attempt" -lt 6 ]; then
              echo "::warning::Release assets are not complete yet (attempt ${attempt}/6); retrying in 5s."
              sleep 5
            fi
          done

          if [ "$generated" != true ]; then
            echo "::error::Could not build a complete updater manifest after 6 attempts."
            exit 1
          fi

      - name: Replace latest.json idempotently
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.preflight.outputs.release-id }}
        run: |
          set -euo pipefail
          LATEST_IDS=$(jq -r '.[] | select(.name == "latest.json") | .id' release-assets.json)
          LATEST_COUNT=$(printf '%s\n' "$LATEST_IDS" | grep -c '[0-9]' || true)
          if [ "$LATEST_COUNT" -gt 1 ]; then
            echo "::error::Release contains multiple latest.json assets; refusing an ambiguous replacement."
            exit 1
          fi
          if [ "$LATEST_COUNT" -eq 1 ]; then
            gh api --method DELETE \
              "repos/${{ github.repository }}/releases/assets/${LATEST_IDS}" \
              >/dev/null
            echo "Removed previous latest.json asset ${LATEST_IDS}."
          fi

          UPLOADED_ID=$(gh api --method POST \
            -H "Content-Type: application/json" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=latest.json" \
            --input latest.json \
            --jq '.id')

          gh api \
            -H "Accept: application/octet-stream" \
            "repos/${{ github.repository }}/releases/assets/${UPLOADED_ID}" \
            > uploaded-latest.json
          if ! cmp -s latest.json uploaded-latest.json; then
            echo "::error::The uploaded latest.json does not match the generated manifest."
            exit 1
          fi

          confirmed=false
          ASSETS_API="repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?per_page=100"
          for attempt in $(seq 1 6); do
            gh api --paginate --slurp "$ASSETS_API" | jq 'add' > uploaded-assets.json
            MATCHING=$(jq '[.[] | select(.name == "latest.json" and .size > 0)] | length' uploaded-assets.json)
            MATCHING_ID=$(jq -r '.[] | select(.name == "latest.json" and .size > 0) | .id' uploaded-assets.json)
            if [ "$MATCHING" -eq 1 ] && [ "$MATCHING_ID" = "$UPLOADED_ID" ]; then
              confirmed=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 2
            fi
          done
          if [ "$confirmed" != true ]; then
            echo "::error::Expected exactly the uploaded non-empty latest.json asset."
            exit 1
          fi
          echo "Uploaded one validated latest.json to release ${RELEASE_ID}."

  finalize-release:
    name: Verify release assets and publish
    needs:
      [
        preflight,
        build-release,
        generate-updater-manifest,
        e2e-golden-flow,
        dependency-audit,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required release assets are present
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The release-assets endpoint can lag briefly right after the last
          # matrix job's upload lands, so retry for up to 30s before failing.
          for attempt in $(seq 1 6); do
            ASSETS=$(gh api "repos/${{ github.repository }}/releases/${{ needs.preflight.outputs.release-id }}/assets" --jq '.[].name')
            MISSING=""
            for ext in msi dmg AppImage; do
              if ! echo "$ASSETS" | grep -qi "\\.${ext}$"; then
                MISSING="$MISSING .$ext"
              fi
            done
            if ! echo "$ASSETS" | grep -qx 'latest.json'; then
              MISSING="$MISSING latest.json"
            fi
            if [ -z "$MISSING" ]; then
              echo "Release assets:"
              echo "$ASSETS"
              echo "All required assets present on attempt $attempt."
              exit 0
            fi
            echo "::warning::Missing assets (attempt $attempt/6):$MISSING"
            sleep 5
          done
          echo "Release assets:"
          echo "$ASSETS"
          echo "::error::Missing required asset(s) after 30 seconds:$MISSING — refusing to publish."
          exit 1

      - name: Add download and installation guide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_SIGNING: ${{ needs.preflight.outputs.windows-signing }}
          MACOS_SIGNING: ${{ needs.preflight.outputs.macos-signing }}
        run: |
          set -euo pipefail

          RELEASE_API="repos/${{ github.repository }}/releases/${{ needs.preflight.outputs.release-id }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          BODY=$(gh api "$RELEASE_API" --jq '.body // ""')
          ASSETS=$(gh api \
            "repos/${{ github.repository }}/releases/${{ needs.preflight.outputs.release-id }}/assets" \
            --jq '.[].name')

          asset_name() {
            local pattern="$1"
            local name
            name=$(printf '%s\n' "$ASSETS" | grep -Ei "$pattern" | head -n1 || true)
            if [ -z "$name" ]; then
              echo "::error::Required release asset matching $pattern was not found."
              exit 1
            fi
            printf '%s' "$name"
          }

          # Anclado a en-US: wix.language declara en-US y es-ES, así que hay
          # dos MSI y el orden de la API es el de subida. Sin anclar, la
          # descarga recomendada podía ser el instalador en español.
          MSI=$(asset_name '_en-US\.msi$')
          EXE=$(asset_name '\.exe$')
          DMG=$(asset_name '\.dmg$')
          APPIMAGE=$(asset_name '\.AppImage$')
          DEB=$(asset_name '\.deb$')
          RPM=$(asset_name '\.rpm$')

          # Una advertencia por plataforma, decidida por el mismo estado que
          # genera signing-evidence.md (AC3). Antes Windows tenía nota y macOS
          # tenía una frase fija que no sabía si el build iba firmado o no.
          if [ "${WINDOWS_SIGNING:-false}" = "true" ]; then
            WINDOWS_NOTE='> [!NOTE]
          > The Windows installer is Authenticode-signed and the signature was
          > verified before publishing.
          > Tauri updater artifacts are cryptographically signed as well.'
          else
            WINDOWS_NOTE='> [!WARNING]
          > **This Windows installer is not code-signed.** Windows SmartScreen
          > will show an **Unknown publisher** warning; you have to choose
          > *More info → Run anyway* to install.
          > Tauri updater artifacts remain cryptographically signed, so
          > in-app updates are still verified.
          > See the `signing-evidence.md` asset below for the full record.'
          fi

          if [ "${MACOS_SIGNING:-false}" = "true" ]; then
            MACOS_NOTE='> [!NOTE]
          > The macOS app is signed with an Apple Developer ID.'
          else
            MACOS_NOTE='> [!WARNING]
          > **This macOS app is not signed or notarized.** Gatekeeper will
          > refuse the first launch. Open **System Settings → Privacy &
          > Security** and allow Vellum to open, or right-click the app and
          > choose *Open*. If macOS still refuses it, clear the quarantine
          > attribute: `xattr -cr /Applications/Vellum.app`
          > Tauri updater artifacts remain cryptographically signed, so
          > in-app updates are still verified.
          > See the `signing-evidence.md` asset below for the full record.
          >
          > **Esta app de macOS no está firmada ni notarizada.** Gatekeeper
          > bloqueará el primer arranque. Abre **Ajustes del Sistema →
          > Privacidad y seguridad** y permite abrir Vellum, o haz clic
          > derecho sobre la app y elige *Abrir*. Si macOS sigue negándose,
          > limpia el atributo de cuarentena: `xattr -cr /Applications/Vellum.app`
          > Los artefactos del actualizador siguen firmados criptográficamente.'
          fi

          GUIDE=$(cat <<'EOF'
          # Download Vellum

          Choose your operating system below. If you're not sure which file to use,
          follow the recommended option for your platform.

          ## 🪟 Windows

          ### Download

          **Recommended:** [Windows MSI installer](__BASE_URL__/__MSI__)

          [Alternative EXE installer](__BASE_URL__/__EXE__)

          __WINDOWS_NOTE__

          ### Installation

          1. Download the **MSI installer** above.
          2. Double-click the downloaded file.
          3. If Windows displays a security warning, continue to the installer.
          4. Follow the on-screen steps.
          5. Open **Vellum** once installation completes.

          If you're unsure which Windows file to use, choose the **MSI**.

          ---

          ## 🍎 macOS

          ### Download

          **Recommended:** [Universal macOS DMG](__BASE_URL__/__DMG__)

          This build works on both **Apple Silicon** and **Intel** Macs.

          ### Installation

          1. Download and open the **DMG**.
          2. Drag **Vellum** into the **Applications** folder.
          3. Open Vellum from Applications.

          __MACOS_NOTE__

          ---

          ## 🐧 Linux

          ### Ubuntu / Debian

          **Recommended:** [DEB package](__BASE_URL__/__DEB__)

          #### Installation

          1. Download the **DEB** package.
          2. Double-click it.
          3. Open it with your system's software installer.
          4. Select **Install**.

          Terminal users can also run:

          ```bash
          sudo apt install ./__DEB__
          ```

          ### Other distributions

          [AppImage](__BASE_URL__/__APPIMAGE__)

          No traditional installation is required:

          ```bash
          chmod +x __APPIMAGE__
          ./__APPIMAGE__
          ```

          ### Fedora / RHEL

          [RPM package](__BASE_URL__/__RPM__)

          ---

          > [!TIP]
          > The `.sig` files, `latest.json`, and updater archives listed under
          > GitHub Assets are primarily used by Vellum's automatic update system.
          > Most users do not need to download them manually.

          ---
          EOF
          )

          GUIDE="${GUIDE//__BASE_URL__/$BASE_URL}"
          GUIDE="${GUIDE//__MSI__/$MSI}"
          GUIDE="${GUIDE//__EXE__/$EXE}"
          GUIDE="${GUIDE//__DMG__/$DMG}"
          GUIDE="${GUIDE//__APPIMAGE__/$APPIMAGE}"
          GUIDE="${GUIDE//__DEB__/$DEB}"
          GUIDE="${GUIDE//__RPM__/$RPM}"
          GUIDE="${GUIDE//__WINDOWS_NOTE__/$WINDOWS_NOTE}"
          GUIDE="${GUIDE//__MACOS_NOTE__/$MACOS_NOTE}"
          GUIDE+=$'\n\n'
          GUIDE+="$BODY"

          gh api -X PATCH "$RELEASE_API" \
            -f body="$GUIDE" \
            >/dev/null

      - name: Checkout release commit for local verification
        uses: actions/checkout@v6

      - name: Verify synchronized version files
        run: node scripts/verify-release-config.mjs

      - name: Download dependency audit report
        id: audit-report
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: dependency-audit

      # La evidencia trazable de AC3. Se genera del mismo estado que decidió
      # las notas (los outputs de preflight), nunca a mano, y se sube antes de
      # publicar: un release sin este asset no llega a `draft=false`.
      - name: Generate and attach signing evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_SIGNING: ${{ needs.preflight.outputs.windows-signing }}
          MACOS_SIGNING: ${{ needs.preflight.outputs.macos-signing }}
          RELEASE_ID: ${{ needs.preflight.outputs.release-id }}
        run: |
          set -euo pipefail

          ASSETS=$(gh api --paginate \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[].name')

          # Un artefacto del updater es `<instalador>.sig` junto al archivo.
          # El patrón se ancla a la línea entera: sin anclar, un asset llamado
          # `notes-about-latest.json.txt` bastaba para declarar presente el
          # manifiesto, y la evidencia afirmaba algo que no estaba ahí.
          asset_matching() {
            printf '%s\n' "$ASSETS" | grep -cE "$1" || true
          }
          updater_signed() {
            if [ "$(asset_matching "$1")" -gt 0 ]; then echo "yes"; else echo "no"; fi
          }

          if [ "${WINDOWS_SIGNING}" = "true" ]; then
            WINDOWS_ROW="| Windows | MSI + EXE | **yes** — Authenticode, verified in CI before upload |"
          else
            WINDOWS_ROW="| Windows | MSI + EXE | **no** — published unsigned; SmartScreen shows *Unknown publisher* |"
          fi

          if [ "${MACOS_SIGNING}" = "true" ]; then
            MACOS_ROW="| macOS | DMG (universal) | **yes** — Apple Developer ID |"
          else
            MACOS_ROW="| macOS | DMG (universal) | **no** — unsigned and un-notarized; Gatekeeper blocks the first launch |"
          fi

          {
            echo "# Signing evidence — ${GITHUB_REF_NAME}"
            echo
            echo "Commit: \`${GITHUB_SHA}\`  "
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Vellum publishes releases whether or not a platform code-signing"
            echo "certificate is available. What it never does is publish without saying"
            echo "so: this file is the record for this exact build."
            echo
            echo "## Platform code signing"
            echo
            echo "| Platform | Artifact | Code-signed |"
            echo "| --- | --- | --- |"
            echo "$WINDOWS_ROW"
            echo "$MACOS_ROW"
            echo "| Linux | AppImage + DEB + RPM | n/a — Linux packages carry no equivalent publisher signature |"
            echo
            echo "## Updater artifact signing"
            echo
            echo "Updater signing is independent of platform code signing and is"
            echo "**mandatory**: the release fails before any build starts without"
            echo "\`TAURI_SIGNING_PRIVATE_KEY\`, and \`latest.json\` would not validate."
            echo
            echo "- \`latest.json\` present: $(updater_signed '^latest\.json$')"
            echo "- Detached \`.sig\` artifacts present: $(updater_signed '\.sig$') ($(asset_matching '\.sig$') artifact(s))"
            echo
            echo "## macOS caveat"
            echo
            echo "The DMG is remounted and repackaged after the build to add the install"
            echo "readme, which would invalidate a signature applied by \`tauri build\`."
            echo "Signing macOS therefore needs that step reworked as well — see"
            echo "\`docs/en/security-and-privacy.md\`."
            echo
            if [ -f dependency-audit.md ]; then
              cat dependency-audit.md
            else
              echo "## Dependency audit"
              echo
              echo "> [!WARNING]"
              echo "> The dependency-audit job produced no report for this run."
            fi
          } > signing-evidence.md

          # Re-running a partially failed publish is a normal recovery path, and
          # the upload endpoint answers 422 when the asset name already exists.
          # Under `set -e` that aborted the run and left the release a draft
          # forever, so replace rather than append.
          EXISTING=$(gh api --paginate \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name == "signing-evidence.md") | .id')
          for asset_id in $EXISTING; do
            gh api --method DELETE \
              "repos/${{ github.repository }}/releases/assets/${asset_id}" >/dev/null
            echo "Replaced a previous signing-evidence.md (asset ${asset_id})."
          done

          gh api --method POST \
            -H "Content-Type: text/markdown" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=signing-evidence.md" \
            --input signing-evidence.md \
            >/dev/null

          echo "Attached signing-evidence.md to release ${RELEASE_ID}."
          cat signing-evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Associate and publish release (required for updater endpoint)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_API="repos/${{ github.repository }}/releases/${{ needs.preflight.outputs.release-id }}"
          RELEASE_TAG=$(gh api "$RELEASE_API" --jq '.tag_name')
          if [ "$RELEASE_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "Associating draft release tag $RELEASE_TAG with triggering tag $GITHUB_REF_NAME."
          fi
          PUBLISHED_TAG=$(gh api -X PATCH "$RELEASE_API" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f draft=false \
            --jq '.tag_name')
          if [ "$PUBLISHED_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release was published with unexpected tag $PUBLISHED_TAG (expected $GITHUB_REF_NAME)."
            exit 1
          fi

      - name: Smoke-check public updater manifest
        id: updater-smoke-check
        env:
          MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          EXPECTED_VERSION: ${{ github.ref_name }}
          EXPECTED_RELEASE_PATH: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            if ! curl --fail --location --silent --show-error \
              "$MANIFEST_URL" \
              -o /tmp/latest.json; then

              echo "::warning::Updater manifest download failed (attempt $attempt/36)."
              sleep 5
              continue
            fi

            if [ ! -s /tmp/latest.json ]; then
              echo "::warning::Updater manifest returned an empty body (attempt $attempt/36)."
              sleep 5
              continue
            fi

            if node -e '
              const fs = require("fs");

              const expectedVersion =
                process.env.EXPECTED_VERSION.slice(1);

              const expectedPath =
                process.env.EXPECTED_RELEASE_PATH;

              const m = JSON.parse(
                fs.readFileSync("/tmp/latest.json", "utf8")
              );

              const platforms =
                Object.values(m.platforms ?? {});

              if (
                m.version !== expectedVersion ||
                platforms.length === 0 ||
                platforms.some(
                  (p) =>
                    typeof p.url !== "string" ||
                    !p.url.startsWith(expectedPath) ||
                    typeof p.signature !== "string" ||
                    p.signature.length === 0
                )
              ) {
                process.exit(1);
              }
            '; then
              echo "Validated updater manifest on attempt $attempt."
              exit 0
            fi

            echo "::warning::Updater manifest downloaded but failed semantic validation for $EXPECTED_VERSION (attempt $attempt/36)."
            sleep 5
          done

          echo "::error::Updater manifest was not valid for $EXPECTED_VERSION after 180 seconds."
          exit 1

      - name: Revert release to draft if finalization fails
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.preflight.outputs.release-id }}" -f draft=true >/dev/null
