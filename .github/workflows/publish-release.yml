name: Publish Release

# Required GitHub Actions secrets (Stories 7.5 and release automation):
#   RELEASE_PLEASE_TOKEN
#     - PAT or GitHub App token used by Release Please. It must be allowed to
#       create pull requests, tags and releases, and is required because a
#       default GITHUB_TOKEN does not reliably trigger the tag workflow.
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     - Sign updater artifacts for tauri-plugin-updater. Not a code-signing
#       certificate; unrelated to Authenticode/SmartScreen (see 7.5 Dev Notes).
#   WINDOWS_CERTIFICATE (base64-encoded .pfx), WINDOWS_CERTIFICATE_PASSWORD
#     - Authenticode code-signing certificate for the Windows MSI (AC3). The
#       preflight job fails before any platform runner starts if these are
#       missing, unless the repository variable ALLOW_UNSIGNED_WINDOWS is
#       explicitly set to 'true' as a temporary opt-in.
#   ALLOW_UNSIGNED_WINDOWS (repository variable, not a secret)
#     - Set to 'true' only for a temporary unsigned Windows release. This
#       bypasses Authenticode import/verification but never bypasses Tauri
#       updater signing via TAURI_SIGNING_PRIVATE_KEY.
#
# Release publication policy:
#   Release Please creates the GitHub Release as a draft and force-creates its
#   tag. This workflow resolves that existing draft, builds and uploads all
#   platform artifacts, then publishes it (draft -> false) ONLY after every
#   platform's signature check, updater manifest check and release-wide asset
#   check pass. NFR12 is reported as a non-blocking size target.
#   A failed verification leaves the release as a draft — nothing is
#   auto-published from a broken build.

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  preflight:
    name: Resolve release draft and verify signing secrets
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.resolve-release.outputs.release-id }}
    steps:
      - name: Resolve existing Release by tag
        id: resolve-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Draft releases are not reliably returned by the release-by-tag
          # endpoint. List releases instead so the Release Please draft is
          # resolvable before it is published. The list-releases endpoint can
          # also lag briefly right after the tag push, so retry for up to 60s.
          RELEASE_ID=""
          for attempt in $(seq 1 12); do
            RELEASE_ID=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | .id' | head -n1)
            if [ -n "$RELEASE_ID" ]; then
              echo "Resolved release id $RELEASE_ID on attempt $attempt."
              break
            fi
            echo "::warning::No GitHub Release found for ${GITHUB_REF_NAME} yet (attempt $attempt/12)."
            sleep 5
          done
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::No GitHub Release exists for ${GITHUB_REF_NAME} after 60 seconds. Release Please must create the draft before this workflow runs."
            exit 1
          fi
          echo "release-id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      # Movido acá desde build-release: antes se repetía este chequeo 3 veces
      # (una por plataforma), cada vez después de instalar todo el toolchain.
      # Acá corre una sola vez, en segundos, antes de gastar cómputo de matriz.
      - name: Verify Tauri updater signing secrets are present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for signed updater artifacts. TAURI_SIGNING_PRIVATE_KEY_PASSWORD may be empty only when the key has no passphrase."
            exit 1
          fi

      - name: Verify Windows signing secrets are present
        if: vars.ALLOW_UNSIGNED_WINDOWS != 'true'
        shell: bash
        run: |
          if [ -z "${{ secrets.WINDOWS_CERTIFICATE }}" ] || [ -z "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" ]; then
            echo "::error::WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD secrets are not set. Refusing to build an unsigned MSI (AC3)."
            exit 1
          fi

  build-frontend:
    name: Build frontend (shared)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Antes, tauri-action reconstruía el frontend una vez por plataforma
      # (3x) vía beforeBuildCommand. Se construye acá una sola vez y se
      # descarga en cada job de build-release (ver build-tauri-platform).
      - name: Build frontend
        run: pnpm --filter @vellum/desktop run build:vite

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
          retention-days: 1

  build-release:
    name: Build ${{ matrix.platform }}
    needs: [preflight, build-frontend]
    strategy:
      fail-fast: false
      # tauri-action merges the existing latest.json when each platform uploads
      # its updater artifacts. Serializing the matrix prevents concurrent
      # read/delete/upload races on that single release asset.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
            bundle-glob: 'target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi'
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            bundle-glob: 'target/universal-apple-darwin/release/bundle/dmg/*.dmg'
          - platform: ubuntu-22.04
            args: ''
            bundle-glob: 'target/release/bundle/appimage/*.AppImage'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vellum Environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ${{ matrix.platform }}

      - name: Build, sign and upload release artifact
        uses: ./.github/actions/build-tauri-platform
        with:
          mode: release
          platform: ${{ matrix.platform }}
          args: ${{ matrix.args }}
          bundle-glob: ${{ matrix.bundle-glob }}
          release-id: ${{ needs.preflight.outputs.release-id }}
          tag-name: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          windows-certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          windows-certificate-password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          tauri-signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri-signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          allow-unsigned-windows: ${{ vars.ALLOW_UNSIGNED_WINDOWS }}

  finalize-release:
    name: Verify release assets and publish
    needs: [preflight, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required release assets are present
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The release-assets endpoint can lag briefly right after the last
          # matrix job's upload lands, so retry for up to 30s before failing.
          for attempt in $(seq 1 6); do
            ASSETS=$(gh api "repos/${{ github.repository }}/releases/${{ needs.preflight.outputs.release-id }}/assets" --jq '.[].name')
            MISSING=""
            for ext in msi dmg AppImage; do
              if ! echo "$ASSETS" | grep -qi "\\.${ext}$"; then
                MISSING="$MISSING .$ext"
              fi
            done
            if ! echo "$ASSETS" | grep -qx 'latest.json'; then
              MISSING="$MISSING latest.json"
            fi
            if [ -z "$MISSING" ]; then
              echo "Release assets:"
              echo "$ASSETS"
              echo "All required assets present on attempt $attempt."
              exit 0
            fi
            echo "::warning::Missing assets (attempt $attempt/6):$MISSING"
            sleep 5
          done
          echo "Release assets:"
          echo "$ASSETS"
          echo "::error::Missing required asset(s) after 30 seconds:$MISSING — refusing to publish."
          exit 1

      - name: Add download and installation guide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_UNSIGNED_WINDOWS: ${{ vars.ALLOW_UNSIGNED_WINDOWS }}
        run: |
          set -euo pipefail

          RELEASE_API="repos/${{ github.repository }}/releases/${{ needs.preflight.outputs.release-id }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          BODY=$(gh api "$RELEASE_API" --jq '.body // ""')
          ASSETS=$(gh api \
            "repos/${{ github.repository }}/releases/${{ needs.preflight.outputs.release-id }}/assets" \
            --jq '.[].name')

          asset_name() {
            local pattern="$1"
            local name
            name=$(printf '%s\n' "$ASSETS" | grep -Ei "$pattern" | head -n1 || true)
            if [ -z "$name" ]; then
              echo "::error::Required release asset matching $pattern was not found."
              exit 1
            fi
            printf '%s' "$name"
          }

          MSI=$(asset_name '\.msi$')
          EXE=$(asset_name '\.exe$')
          DMG=$(asset_name '\.dmg$')
          APPIMAGE=$(asset_name '\.AppImage$')
          DEB=$(asset_name '\.deb$')
          RPM=$(asset_name '\.rpm$')

          if [ "${ALLOW_UNSIGNED_WINDOWS:-}" = "true" ]; then
            WINDOWS_NOTE='> [!NOTE]
          > Vellum is not yet Authenticode-signed on Windows.
          > Windows may display an **Unknown publisher** warning.
          > Tauri updater artifacts remain cryptographically signed.'
          else
            WINDOWS_NOTE='> [!NOTE]
          > The Windows installer is Authenticode-signed.
          > Tauri updater artifacts are cryptographically signed as well.'
          fi

          GUIDE=$(cat <<'EOF'
          # Download Vellum

          Choose your operating system below. If you're not sure which file to use,
          follow the recommended option for your platform.

          ## 🪟 Windows

          ### Download

          **Recommended:** [Windows MSI installer](__BASE_URL__/__MSI__)

          [Alternative EXE installer](__BASE_URL__/__EXE__)

          __WINDOWS_NOTE__

          ### Installation

          1. Download the **MSI installer** above.
          2. Double-click the downloaded file.
          3. If Windows displays a security warning, continue to the installer.
          4. Follow the on-screen steps.
          5. Open **Vellum** once installation completes.

          If you're unsure which Windows file to use, choose the **MSI**.

          ---

          ## 🍎 macOS

          ### Download

          **Recommended:** [Universal macOS DMG](__BASE_URL__/__DMG__)

          This build works on both **Apple Silicon** and **Intel** Macs.

          ### Installation

          1. Download and open the **DMG**.
          2. Drag **Vellum** into the **Applications** folder.
          3. Open Vellum from Applications.

          > [!NOTE]
          > If macOS prevents Vellum from opening because the developer cannot
          > be verified, go to **System Settings → Privacy & Security** and allow
          > Vellum to open.

          ---

          ## 🐧 Linux

          ### Ubuntu / Debian

          **Recommended:** [DEB package](__BASE_URL__/__DEB__)

          #### Installation

          1. Download the **DEB** package.
          2. Double-click it.
          3. Open it with your system's software installer.
          4. Select **Install**.

          Terminal users can also run:

          ```bash
          sudo apt install ./__DEB__
          ```

          ### Other distributions

          [AppImage](__BASE_URL__/__APPIMAGE__)

          No traditional installation is required:

          ```bash
          chmod +x __APPIMAGE__
          ./__APPIMAGE__
          ```

          ### Fedora / RHEL

          [RPM package](__BASE_URL__/__RPM__)

          ---

          > [!TIP]
          > The `.sig` files, `latest.json`, and updater archives listed under
          > GitHub Assets are primarily used by Vellum's automatic update system.
          > Most users do not need to download them manually.

          ---
          EOF
          )

          GUIDE="${GUIDE//__BASE_URL__/$BASE_URL}"
          GUIDE="${GUIDE//__MSI__/$MSI}"
          GUIDE="${GUIDE//__EXE__/$EXE}"
          GUIDE="${GUIDE//__DMG__/$DMG}"
          GUIDE="${GUIDE//__APPIMAGE__/$APPIMAGE}"
          GUIDE="${GUIDE//__DEB__/$DEB}"
          GUIDE="${GUIDE//__RPM__/$RPM}"
          GUIDE="${GUIDE//__WINDOWS_NOTE__/$WINDOWS_NOTE}"
          GUIDE+=$'\n\n'
          GUIDE+="$BODY"

          gh api -X PATCH "$RELEASE_API" \
            -f body="$GUIDE" \
            >/dev/null

      - name: Checkout release commit for local verification
        uses: actions/checkout@v4

      - name: Verify synchronized version files
        run: node scripts/verify-release-config.mjs

      - name: Associate and publish release (required for updater endpoint)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_API="repos/${{ github.repository }}/releases/${{ needs.preflight.outputs.release-id }}"
          RELEASE_TAG=$(gh api "$RELEASE_API" --jq '.tag_name')
          if [ "$RELEASE_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "Associating draft release tag $RELEASE_TAG with triggering tag $GITHUB_REF_NAME."
          fi
          PUBLISHED_TAG=$(gh api -X PATCH "$RELEASE_API" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f draft=false \
            --jq '.tag_name')
          if [ "$PUBLISHED_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release was published with unexpected tag $PUBLISHED_TAG (expected $GITHUB_REF_NAME)."
            exit 1
          fi

      - name: Smoke-check public updater manifest
        id: updater-smoke-check
        env:
          MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          EXPECTED_VERSION: ${{ github.ref_name }}
          EXPECTED_RELEASE_PATH: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            if ! curl --fail --location --silent --show-error \
              "$MANIFEST_URL" \
              -o /tmp/latest.json; then

              echo "::warning::Updater manifest download failed (attempt $attempt/36)."
              sleep 5
              continue
            fi

            if [ ! -s /tmp/latest.json ]; then
              echo "::warning::Updater manifest returned an empty body (attempt $attempt/36)."
              sleep 5
              continue
            fi

            if node -e '
              const fs = require("fs");

              const expectedVersion =
                process.env.EXPECTED_VERSION.slice(1);

              const expectedPath =
                process.env.EXPECTED_RELEASE_PATH;

              const m = JSON.parse(
                fs.readFileSync("/tmp/latest.json", "utf8")
              );

              const platforms =
                Object.values(m.platforms ?? {});

              if (
                m.version !== expectedVersion ||
                platforms.length === 0 ||
                platforms.some(
                  (p) =>
                    typeof p.url !== "string" ||
                    !p.url.startsWith(expectedPath) ||
                    typeof p.signature !== "string" ||
                    p.signature.length === 0
                )
              ) {
                process.exit(1);
              }
            '; then
              echo "Validated updater manifest on attempt $attempt."
              exit 0
            fi

            echo "::warning::Updater manifest downloaded but failed semantic validation for $EXPECTED_VERSION (attempt $attempt/36)."
            sleep 5
          done

          echo "::error::Updater manifest was not valid for $EXPECTED_VERSION after 180 seconds."
          exit 1

      - name: Revert release to draft if finalization fails
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.preflight.outputs.release-id }}" -f draft=true >/dev/null
