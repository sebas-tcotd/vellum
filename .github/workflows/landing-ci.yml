name: Landing Validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate landing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ubuntu-latest
          rust: 'false'
          linux-deps: 'false'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate landing types
        run: pnpm --filter @vellum/landing lint

      - name: Build landing
        run: pnpm --filter @vellum/landing build
