name: Landing Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - '.github/workflows/landing-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate landing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate landing types
        run: pnpm --filter @vellum/landing lint

      - name: Build landing
        run: pnpm --filter @vellum/landing build
