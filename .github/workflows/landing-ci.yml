name: Landing Validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate landing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node environment
        uses: ./.github/actions/setup-vellum
        with:
          os: ubuntu-latest
          rust: 'false'
          linux-deps: 'false'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate landing types
        run: pnpm --filter @vellum/landing lint

      - name: Build landing
        env:
          # Deterministic PR builds: the live API is exercised by the deploy.
          LANDING_RELEASE_SOURCE: fixture
        run: pnpm --filter @vellum/landing build

      - name: Install Chromium for static browser tests
        run: pnpm --filter @vellum/landing exec playwright install --with-deps chromium

      - name: Test routes, consent, privacy and the home in the static build under /vellum/
        run: pnpm --filter @vellum/landing test:static

      # The embedded app components must keep matching the app pixel for
      # pixel (spike REPORT; deferred-work: embed contract in CI).
      - name: Build the app component embed comparison
        run: pnpm --filter @vellum/landing spike:build

      - name: Compare embedded app components with the app
        run: pnpm --filter @vellum/landing test:spike
