[package]
name = "parser-cslmap"
version = "0.1.0"
description = "Reads .cslmap and .vellummap city documents into Vellum's CityData."
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.41" }
tauri = { version = "2", features = [] }
contour-isobands = "0.4"
contour = "0.13.1"
geo = "0.33"
serde_json = "1"
image = { version = "0.24", default-features = false, features = ["png"] }
base64 = "0.22"
# `.vellummap` container. Only the deflate codec, through flate2's pure-Rust backend
# (miniz_oxide) — the same one `image`/`png` already compile — so no new crates.
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10.9"
# Collects the paths of the fields a `.vellummap` reader ignores, in the same pass that
# deserializes the JSON: tolerance to newer minors without parsing a module twice.
serde_ignored = "0.1"

[dev-dependencies]
